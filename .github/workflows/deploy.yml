name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Record every lesson line with Supertonic 3 (open-source Korean and
      # Russian voices). Cached, so only new or changed lines are recorded.
      - run: node scripts/collect-speech.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-audio.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/supertonic3
            public/audio
          key: audio-${{ hashFiles('speech/lines.json', 'scripts/make-audio.py', '.github/workflows/deploy.yml') }}
          restore-keys: audio-
      - run: pip install -r scripts/requirements-audio.txt
      - run: python scripts/make-audio.py --samples
        # Without recordings the app still works with the device voice.
        continue-on-error: true
        env:
          KO_VOICE: F1
          RU_VOICE: F2
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
